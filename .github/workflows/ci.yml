name: CI

on:
  push:
  pull_request:

jobs:
  # O nome do job ("test") é o status check exigido na proteção da branch main.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Instalar dependências (lockfile congelado)
        run: yarn install --frozen-lockfile

      - name: Checagem de tipos
        run: yarn typecheck

      - name: Testes unitários e de componentes (Vitest + RTL)
        run: yarn test

      - name: Instalar navegador do Playwright
        run: yarn playwright install --with-deps chromium

      - name: Testes ponta a ponta (Playwright, headless)
        run: yarn test:e2e

      - name: Salvar relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
